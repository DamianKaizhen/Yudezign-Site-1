    <!-- "default", NOT "black-translucent".
         black-translucent tells iOS to lay the page out UNDER the status bar,
         which puts anything positioned at top-0 — the site's hamburger, the
         portal's header — behind the clock and battery, where taps land on the
         status bar instead. Nothing here is designed to bleed under it, so let
         iOS reserve that space. Same reason there is no viewport-fit=cover. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
